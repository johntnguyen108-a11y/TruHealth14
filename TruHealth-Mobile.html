
<!-- TruHealth-Mobile.fixed.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TruHealth" />
  <title>TruHealth Mobile</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(180deg,#f5f5f7 0%, #e8e8ea 100%); overflow-x:hidden; font-weight:400; }
    .app-header { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 20px; border-bottom: 1px solid rgba(0,0,0,0.06); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 20px rgba(0,0,0,0.04); position: sticky; top:0; z-index:100; }
    .header-logo { height:130px; width:auto; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12)); }
    .app-container { padding-bottom:95px; min-height: 100vh; }
    .page-header { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 14px 20px; display:flex; align-items:center; border-bottom:1px solid rgba(0,0,0,0.06); position: sticky; top:0; z-index:50; justify-content:space-between; box-shadow:0 4px 20px rgba(0,0,0,0.04); }
    .page-header .header-logo { height:32px; width:auto; position:absolute; left:50%; transform: translateX(-50%); }
    .page-header h2 { display:none; }
    .back-btn { font-size:17px; color:#1e88e5; cursor:pointer; background: rgba(30,136,229,0.1); border:none; font-weight:600; padding:10px 16px; border-radius:12px; transition: all .3s; }
    .back-btn:active { transform: scale(.95); background: rgba(30,136,229,0.2); }

    .header { background: linear-gradient(135deg,#1e88e5 0%, #43a047 100%); color:white; padding:40px 20px 35px; text-align:center; box-shadow:0 8px 32px rgba(30,136,229,.3); position:relative; overflow:hidden; }
    .header p { font-size:17px; opacity:.95; font-weight:500; letter-spacing:.3px; text-shadow:0 2px 8px rgba(0,0,0,.15) }

    .page-content { padding:20px; padding-top:24px; }
    .feature-card { background: rgba(255,255,255,0.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:20px; padding:24px; margin-bottom:16px; box-shadow:0 8px 32px rgba(0,0,0,0.08); cursor:pointer; transition: all .4s; border:1px solid rgba(255,255,255,.5); position:relative; overflow:hidden; }
    .feature-card:active { transform: translateY(-2px) scale(.98); box-shadow:0 12px 48px rgba(30,136,229,.25); }
    .feature-icon { width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:14px; box-shadow:0 4px 16px rgba(0,0,0,.12) }
    .feature-card h3 { font-size:19px; font-weight:700; margin-bottom:8px; letter-spacing:-.3px; color:#1d1d1f; }
    .feature-card p { font-size:15px; color:#86868b; line-height:1.5; font-weight:400; }

    .search-section, .filter-section, .booking-section, .profile-section, .analysis-result { background: rgba(255,255,255,0.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:18px; padding:20px; margin-bottom:16px; box-shadow:0 4px 20px rgba(0,0,0,.06); border:1px solid rgba(255,255,255,.5); }
    .input-group { margin-bottom:18px; }
    .input-group label { display:block; font-size:15px; font-weight:600; margin-bottom:10px; color:#1d1d1f; letter-spacing:-.2px }
    .search-input, select, textarea { width:100%; padding:15px 18px; border:2px solid rgba(229,229,231,.6); border-radius:14px; font-size:17px; transition: all .3s; background: rgba(255,255,255,.8) }
    .search-input:focus, select:focus, textarea:focus { outline:none; border-color:#1e88e5; box-shadow:0 0 0 4px rgba(30,136,229,.1); background:white; transform: translateY(-1px) }

    .filter-chips, .symptom-chips { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .chip, .symptom-chip { padding:12px 20px; background:linear-gradient(145deg,#fff,#f0f0f0); border-radius:24px; font-size:15px; border:2px solid rgba(229,229,231,.4); cursor:pointer; transition: all .35s; box-shadow:3px 3px 8px rgba(0,0,0,.08), -3px -3px 8px rgba(255,255,255,.9); font-weight:500 }
    .chip.active { background: linear-gradient(135deg,#1e88e5 0%, #43a047 100%); color:white; border-color:transparent; transform: scale(1.06); box-shadow:0 6px 20px rgba(30,136,229,.4) }
    .symptom-chip { background:linear-gradient(145deg,#fff,#f8f8f8); border:2px solid #1e88e5; color:#1e88e5; box-shadow:0 4px 12px rgba(30,136,229,.2); font-weight:600 }

    .provider-card { background: rgba(255,255,255,.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius:18px; padding:20px; margin-bottom:14px; border:1px solid rgba(229,229,231,.4); cursor:pointer; display:flex; gap:16px; transition: all .35s; box-shadow:0 4px 20px rgba(0,0,0,.06); }
    .provider-avatar { width:68px; height:68px; border-radius:18px; font-size:36px; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 16px rgba(0,0,0,.12); }
    .provider-details { flex:1 }
    .rating { color:#ff9500; font-weight:600; text-shadow:0 1px 2px rgba(255,149,0,.3) }

    .message { margin-bottom:18px; display:flex; gap:10px; }
    .message-bubble { max-width:80%; padding:16px 18px; border-radius:20px; font-size:16px; line-height:1.6; box-shadow:0 2px 12px rgba(0,0,0,.08); }
    .message.ai .message-bubble { background: linear-gradient(145deg,#f0f0f0,#fff); color:#1d1d1f; border-bottom-left-radius:6px }
    .message.user .message-bubble { background: linear-gradient(135deg,#1e88e5 0%, #43a047 100%); color:white; border-bottom-right-radius:6px }

    .treatment-step { background:linear-gradient(145deg, rgba(30,136,229,.08), rgba(30,136,229,.12)); border-left:4px solid #1e88e5; padding:16px; margin:12px 0; border-radius:12px; box-shadow:0 2px 12px rgba(30,136,229,.1) }
    .treatment-step.warning { background:linear-gradient(145deg, rgba(255,193,7,.08), rgba(255,193,7,.12)); border-left-color:#ffc107 }
    .treatment-step.urgent { background:linear-gradient(145deg, rgba(255,59,48,.08), rgba(255,59,48,.12)); border-left-color:#ff3b30 }
    .treatment-step-title { font-weight:700; margin-bottom:8px; color:#1e88e5; font-size:17px }
    .treatment-step.urgent .treatment-step-title { color:#ff3b30 }
    .treatment-step.warning .treatment-step-title { color:#f57c00 }

    .chat-input-container { position: fixed; bottom: 90px; left: 0; right: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top:1px solid rgba(0,0,0,.06); padding: 14px 16px; display:flex; gap:12px; box-shadow:0 -4px 20px rgba(0,0,0,.04) }
    .chat-input { flex:1; padding:14px 18px; border:2px solid rgba(229,229,231,.6); border-radius:24px; font-size:16px; background:rgba(255,255,255,.9) }
    .send-btn { background: linear-gradient(135deg,#1e88e5 0%, #43a047 100%); color:white; border:none; width:46px; height:46px; border-radius:23px; cursor:pointer; font-size:20px; box-shadow:0 4px 16px rgba(30,136,229,.3); display:flex; align-items:center; justify-content:center }

    .bottom-nav { position: fixed; bottom:0; left:0; right:0; height:95px; background: rgba(255,255,255,.95); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-top:1px solid rgba(0,0,0,.06); display:flex; justify-content: space-around; padding-top:12px; box-shadow:0 -8px 32px rgba(0,0,0,.06) }
    .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; padding:10px; border-radius:16px }
    .nav-item.active { background: linear-gradient(135deg, rgba(30,136,229,.12), rgba(67,160,71,.12)) }
    .nav-icon { font-size:28px }

    .btn-primary, .book-button, .report-button { background: linear-gradient(135deg,#1e88e5 0%, #43a047 100%); color:white; border:none; padding:18px; border-radius:16px; font-size:18px; font-weight:700; cursor:pointer; width:100%; margin-top:14px; box-shadow:0 6px 24px rgba(30,136,229,.35) }
    .report-button { background: linear-gradient(135deg, #ff3b30 0%, #ff6b6b 100%); }

    .no-results { text-align:center; padding:80px 20px; color:#86868b }

    .insurance-badge { display:inline-block; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700; margin-right:6px; margin-bottom:6px }
    .insurance-badge.accepted { background: rgba(67,160,71,.15); color:#2e7d32; border:2px solid #43a047 }
    .insurance-badge.not-accepted { background: rgba(255,59,48,.15); color:#c62828; border:2px solid #ff3b30 }

    /* Call screen */
    .call-doctor-screen { display:none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index:200 }
    .call-doctor-screen.active { display:block }
    .call-option { background: rgba(255,255,255,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:18px; padding:24px; margin-bottom:16px; border:2px solid rgba(229,229,231,.4); cursor:pointer; box-shadow:0 4px 20px rgba(0,0,0,.06) }
    .call-loading { display:none; text-align:center; padding:80px 20px }
    .loading-spinner { width:64px; height:64px; border:5px solid rgba(229,229,231,.3); border-top-color:#1e88e5; border-radius:50%; margin:0 auto 24px; animation: spin 1s linear infinite }
    @keyframes spin { to{ transform: rotate(360deg) } }
    .call-screen { display:none; background: linear-gradient(135deg,#1e88e5 0%, #43a047 100%); color:white; text-align:center; height:100%; padding:100px 20px; position:relative }
    .call-screen.active { display:flex; flex-direction:column; align-items:center; justify-content:space-between }
    .caller-avatar { width:150px; height:150px; border-radius:75px; background: rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:75px; margin:60px auto 24px }
    .end-call-btn { width:80px; height:80px; border-radius:40px; background: linear-gradient(135deg,#ff3b30 0%, #ff6b6b 100%); border:none; color:white; font-size:38px; cursor:pointer; margin-bottom:60px; box-shadow: 0 8px 32px rgba(255,59,48,.4) }

    /* Calendar */
    .month-navigation { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding:12px; background: rgba(255,255,255,.5); border-radius:12px }
    .month-arrow { width:40px; height:40px; border-radius:20px; background:linear-gradient(135deg,#1e88e5 0%, #43a047 100%); color:white; border:none; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(30,136,229,.3) }
    .month-display { font-size:18px; font-weight:700; color:#1d1d1f }
    .day-labels { display:grid; grid-template-columns: repeat(7,1fr); gap:8px; margin-bottom:12px; font-size:12px; font-weight:600; color:#86868b; text-align:center }
    .date-grid { display:grid; grid-template-columns: repeat(7,1fr); gap:12px; margin-top:14px }
    .date-cell { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:12px; font-size:15px; cursor:pointer; border:2px solid rgba(229,229,231,.6); padding:10px; background: linear-gradient(145deg,#fff,#f8f8f8); box-shadow:0 2px 8px rgba(0,0,0,.04); font-weight:600 }
    .date-cell.selected { background: linear-gradient(135deg,#1e88e5 0%, #43a047 100%); color:white; border-color:transparent }
    .date-cell.disabled { opacity:.3; cursor:not-allowed }

    /* Bills */
    .bill-list { margin-top:20px }
    .bill-item { background:rgba(255,255,255,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:18px; padding:20px; margin-bottom:14px; border:2px solid rgba(229,229,231,.4); cursor:pointer; box-shadow:0 4px 20px rgba(0,0,0,.06); display:flex; align-items:center; gap:16px }
    .bill-icon { width:60px; height:60px; border-radius:16px; background: linear-gradient(135deg,#1e88e5 0%, #43a047 100%); display:flex; align-items:center; justify-content:center; font-size:32px; color:white }
    .bill-details { flex:1 }
    .bill-details h4 { font-size:17px; font-weight:700; margin-bottom:6px; letter-spacing:-.3px }
    .bill-amount { font-size:20px; font-weight:700; color:#1e88e5 }
    .bill-savings { font-size:16px; font-weight:600; color:#43a047 }
    .upload-another-btn { background: rgba(30,136,229,.1); color:#1e88e5; border:2px dashed #1e88e5; padding:18px; border-radius:16px; font-size:17px; font-weight:600; cursor:pointer; width:100%; margin-top:14px; text-align:center }
  </style>
</head>
<body>
  <div class="app-header">
    <img src="TruHealth_Logo.png" alt="TruHealth" class="header-logo" />
  </div>
  <div class="app-container" id="appContainer"></div>
  <div class="bottom-nav">
    <div class="nav-item active" onclick="showPage('home')"><div class="nav-icon">🏥</div><span>Home</span></div>
    <div class="nav-item" onclick="showPage('search')"><div class="nav-icon">🔍</div><span>Find Care</span></div>
    <div class="nav-item" onclick="showPage('chatbot')"><div class="nav-icon">💬</div><span>Assistant</span></div>
    <div class="nav-item" onclick="showPage('bills')"><div class="nav-icon">📄</div><span>Bills</span></div>
    <div class="nav-item" onclick="showPage('premium')"><div class="nav-icon">⭐</div><span>Premium</span></div>
  </div>
  <script src="providers.fixed.js"></script>
  <script src="app-mobile.fixed.js"></script>
</body>
</html>
